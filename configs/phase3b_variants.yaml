# configs/phase3b_variants.yaml — Phase 3b agent-variant grid
#
# 16 examinees: 2 models × 1 temperature × 2 strictness × 4 agent_types
# Each examinee is administered the full 1,284-item frozen Phase 2 bank.
#
# Groq call budget (rough):
#   zero_shot / retrieval: 1 call/item  → 2 × 2 × 1,284 = 5,136 calls
#   critic (n_rounds=1):  3 calls/item  → 2 × 2 × 3,852 = 15,408 calls
#   step_decomp:          4 calls/item  → 2 × 2 × 5,136 = 20,544 calls
#   Total ≈ 41,000 Groq calls (judge calls are additional ~20k)

run_id: phase3b_variants

grid:
  models:
    - llama-3.3-70b-versatile
    - llama-3.1-8b-instant
  temperatures:
    - 0.4
  strictness_levels:
    - none
    - strict
  agent_types:
    - zero_shot
    - retrieval
    - critic
    - step_decomp

baseline:
  model: llama-3.1-8b-instant
  temperature: 0.1
  strictness: none
  agent_type: zero_shot

retrieval:
  k: 3

critic:
  n_rounds: 1

bank_path: evaluator/output/phase2_frozen_bank.jsonl
log_dir: logs/arena_runs
parallelism: 8
